# ============================================================
# Render Blueprint - MediFlow Backend
# Deploy with: https://render.com/deploy
# ============================================================

services:
  - type: web
    name: mediflow-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: WHISPER_MODEL
        value: base
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
    disk:
      name: mediflow-uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: mediflow-db
    plan: free
    databaseName: mediflow
    user: mediflow
